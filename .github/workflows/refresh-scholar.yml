# ---------------------------------------------------------------------------
# refresh-scholar.yml — keep data/scholar.json current, without anyone running
# anything.
#
# WHY THIS EXISTS
# ---------------
# The citation figures on this site come from `data/scholar.json`, a file in
# this repository, not from a call to Google made by the visitor's browser.
# README §18 is the whole argument; the short version is that Scholar sends no
# CORS header, has no API, and is blocked in one of the two countries this site
# is read in — so a live call would be impossible, would break the site's
# one-external-host rule, and would fail exactly the readers it was meant to
# serve.
#
# That leaves one question: who runs `node tools/fetch-scholar.mjs`, and how
# often. The answer used to be "a person, when they remember". This is that
# person, twice a day, on a machine that is already awake.
#
# WHAT IT DOES NOT DO
# -------------------
# It never fails loudly and it never writes a number it is unsure of. Scholar
# answers a datacentre IP with a captcha fairly often; when it does,
# `fetch-scholar.mjs` exits non-zero having changed nothing, this job records a
# notice and finishes green. The failure mode stays what it always was — "the
# numbers are a day old" — and never becomes "the numbers are wrong", "the
# numbers vanished", or "there is a red cross on the repository again".
#
# That is also why it runs twice: two attempts twelve hours apart from
# different pools of runner addresses turn a captcha into a delay rather than a
# missed day.
#
# WHAT HAPPENS AFTER IT COMMITS
# -----------------------------
# With Pages set to "Deploy from a branch", a push to `main` rebuilds the site,
# so the new figures are live within a minute or two. If you ever find that the
# push lands but Pages does not rebuild, that is the known GITHUB_TOKEN
# restriction — see README §18.2 for the two-line fix (a deploy key or a PAT).
#
# The sharif.edu mirror is a separate machine that nothing here can reach.
# `tools/refresh-scholar.ps1` is the other half of this, for that copy.
# ---------------------------------------------------------------------------
name: Refresh the Google Scholar snapshot

on:
  schedule:
    # EIGHT TIMES A DAY, AND THAT IS FEWER REQUESTS THAN TWICE A DAY WAS.
    #
    # Scholar does not refuse this profile, it refuses the CALLER: GitHub's
    # runners are shared datacenter addresses whose reputation is set by
    # everyone else using them, and a run either lands on an address Scholar
    # will answer or it does not. Between 23 and 26 September six consecutive
    # runs were refused and the site sat three days stale.
    #
    # Cutting the frequency cannot help. One run asks twice, so the old
    # schedule spent four requests a day — nothing next to a rate limit we are
    # not the cause of. What does help is more DIFFERENT addresses, because
    # every run gets a fresh runner: the variance is between runs, not within
    # one, which is also why retrying inside a run is nearly useless.
    #
    # So the schedule is eight staggered slots, and the job asks Scholar only
    # when the snapshot is not already today's. A day that succeeds on the
    # first slot makes two requests and then seven runs that contact nobody —
    # HALF the old traffic. A day that keeps being refused gets eight tries
    # from eight addresses instead of two. Better on both counts.
    #
    # Odd minutes, never on the hour: GitHub's cron is best-effort and drops
    # runs from the congested on-the-hour slots.
    - cron: '17 1 * * *'
    - cron: '43 4 * * *'
    - cron: '11 7 * * *'
    - cron: '37 10 * * *'
    - cron: '23 13 * * *'
    - cron: '49 16 * * *'
    - cron: '19 19 * * *'
    - cron: '41 22 * * *'
  # So you can also press the button: Actions → this workflow → Run workflow.
  workflow_dispatch:

permissions:
  # The one permission it needs: to push the changed data file back.
  contents: write

concurrency:
  # Two runs writing the same file would be a merge conflict waiting to happen.
  group: refresh-scholar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Whether this run actually pushed a commit. The deploy job below reads it:
    # a run that found no change has nothing to publish.
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone: the commit step ends in
          # `git pull --rebase`, and rebasing inside a depth-1 clone is a corner
          # this job has no reason to stand in.
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Is the snapshot already today's?
        id: gate
        # The whole point of running eight times a day rather than twice. A run
        # that finds today's date in the file contacts nobody and stops here, so
        # the extra slots cost nothing on a day that has already worked — they
        # are there to give a REFUSED day more addresses to try from.
        run: |
          have=$(node -e "process.stdout.write(String(require('./data/scholar.json').fetched || ''))")
          today=$(date -u +%Y-%m-%d)
          if [ "$have" = "$today" ]; then
            echo "stale=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=Already today's::data/scholar.json was fetched $have. Scholar was not contacted this run."
          else
            echo "stale=yes" >> "$GITHUB_OUTPUT"
            echo "Snapshot is from $have, today is $today — asking Scholar."
          fi

      - name: Ask Google Scholar
        id: fetch
        if: steps.gate.outputs.stale == 'yes'
        run: |
          # `if …; then` and not a bare call: a captcha is an ordinary outcome
          # here, not a broken build. The tool has already left data/scholar.json
          # untouched by the time it exits non-zero.
          if node tools/fetch-scholar.mjs; then
            echo "answered=yes" >> "$GITHUB_OUTPUT"
          else
            echo "answered=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=Scholar did not answer cleanly::The profile was not readable this run - a captcha, a consent page or a timeout. data/scholar.json was left exactly as it was, so the site keeps showing the figures it already had. The next scheduled run tries again."
          fi

      - name: Check what was written
        if: steps.fetch.outputs.answered == 'yes'
        # The same guard a person would run by hand: the file parses, the
        # figures are figures, the snapshot is inside its age limit, and the
        # title normaliser still agrees with the browser's copy. A fetch that
        # wrote something this cannot vouch for must not be committed.
        run: node tools/check-scholar.mjs

      - name: Commit, if the numbers moved
        id: commit
        if: steps.fetch.outputs.answered == 'yes'
        run: |
          if git diff --quiet -- data/scholar.json; then
            echo "::notice title=No change::Scholar answered, and the figures are the same as yesterday's. Nothing committed."
            exit 0
          fi

          # The figures go in the commit subject, so `git log --oneline` on this
          # file reads as the citation history of the profile.
          SUMMARY=$(node -e '
            const d = require("./data/scholar.json");
            const m = d.metrics || {};
            process.stdout.write(
              `${m.citations} citations, h ${m.hIndex}, i10 ${m.i10Index}` +
              ` (${(d.papers || []).length} cited papers)`
            );
          ')

          # Commit as the repository owner, not as the bot: a bot identity here
          # adds github-actions[bot] to the Contributors list on GitHub.
          git config user.name  "HKULegend"
          git config user.email "msadeghi@connect.hku.hk"
          git add data/scholar.json
          git commit -m "Scholar: ${SUMMARY}" -m "Refreshed by .github/workflows/refresh-scholar.yml. See README §18."

          # Rebase rather than merge: this job owns one file, and a merge commit
          # for a one-line data change is noise in a history a person reads.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          # Tells the deploy job below that there is something new to publish.
          echo "pushed=yes" >> "$GITHUB_OUTPUT"

          echo "::notice title=Updated::${SUMMARY}"

# ---------------------------------------------------------------------------
# Publish what was just committed.
# ---------------------------------------------------------------------------
# A push made with the default GITHUB_TOKEN does not start another workflow —
# GitHub's rule against recursion. While Pages built the branch itself that did
# not matter; since the site is deployed by a workflow it matters a great deal,
# because the commit above would sit in the repository and never reach anyone.
# That is exactly what happened on 2026-09-21: the 20:07 run committed 2068
# citations and hsadeghi.org went on saying 2067 for the next twelve hours.
#
# Calling the deploy workflow from inside this run sidesteps the rule: it is one
# run, not a second event, so nothing has to be triggered by the push.
# ---------------------------------------------------------------------------
  deploy:
    needs: refresh
    if: needs.refresh.outputs.pushed == 'yes'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
