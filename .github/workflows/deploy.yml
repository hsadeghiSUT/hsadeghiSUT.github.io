# ---------------------------------------------------------------------------
# Deploy hsadeghi.org
# ---------------------------------------------------------------------------
# This replaces the branch build GitHub Pages used to do on its own. The only
# thing it adds is one step — `tools/fingerprint.mjs` — and that step is the
# whole reason the workflow exists.
#
# GitHub Pages serves `assets/**` with `Cache-Control: max-age=14400` and will
# not let you change that header. While every asset URL stayed the same from one
# deploy to the next, a returning visitor kept running the code they already
# had, for up to four hours. Worse, a hard reload did not reliably fix it: the
# publications explorer is reached through an `import()` fired after the page
# has loaded, and a request made that late falls back to the ordinary cache.
#
# The fingerprint step rewrites every stylesheet, script and import specifier to
# carry `?v=<commit>`, so a deploy produces URLs no browser has ever seen. It
# fails the build rather than deploy a half-stamped module graph — see the
# header of the script for what it does and does not touch.
#
# Nothing in the repository is rewritten. What is served is a stamped copy,
# built here, in `_site/`.
# ---------------------------------------------------------------------------
name: Deploy the site

on:
  push:
    branches: [main]
  # So you can redeploy without a commit: Actions → this workflow → Run workflow.
  workflow_dispatch:
  # Called by refresh-scholar.yml after it commits a new snapshot. A push made
  # with GITHUB_TOKEN cannot start a workflow of its own, so the refresh has to
  # ask for the deploy directly — see the note at the end of that file.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One deploy at a time, and let a running one finish: cancelling half way
  # through leaves the live site on the previous build with no sign of why.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # `ref` is explicit on purpose. For a scheduled run that then commits, the
      # event's SHA is the head from *before* the commit, and a bare checkout
      # would faithfully build the tree that is already deployed.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The structured data is generated from data/site.json and data/home.json
      # (§20). Editing either without regenerating would leave the <script
      # type="application/ld+json"> blocks describing a profile that has moved,
      # which nothing on the rendered page would reveal. Fail the deploy instead.
      - name: Check the structured data is current
        run: node tools/build-seo.mjs --check

      # The version comes from the checked-out commit, so every commit —
      # including the twice-daily Scholar refresh — gets its own set of URLs.
      # This also pre-renders the page content into the HTML (§20.2).
      - name: Stamp the asset URLs and pre-render
        run: node tools/fingerprint.mjs

      - uses: actions/configure-pages@v5

      # `_site/` carries CNAME, so the custom domain survives the deploy.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
